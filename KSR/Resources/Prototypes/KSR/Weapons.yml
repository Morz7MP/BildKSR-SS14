- type: entity
  parent: BaseWeaponRifle
  id: Ak74m
  name: Ak74m
  description: Ak74m
  components:
  - type: Sprite
    sprite: KSR/Ak74m.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: KSR/Ak74m.rsi
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -16
  - type: Gun
    angleIncrease: 1.5
    angleDecay: 9.5
    fireRate: 10
    availableModes: 
      - SemiAuto
      - FullAuto
    soundGunshot:
      path: /Audio/KSR/Ak74m/vistrel.ogg
  - type: ChamberMagazineAmmoProvider
    boltClosed: null
    soundRack:
      path: /Audio/KSR/Ak74m/zatvor.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: 6l23
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - 6l23
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - 54539
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

