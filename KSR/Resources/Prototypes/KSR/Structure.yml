- type: entity
  parent: [ BaseStructure, StructureHealthBarrier ]
  id: ArmaturniKarkas
  name: ArmaturniKarkas
  description: ArmaturniKarkas
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/grille_hit.ogg"
  - type: CanBuildWindowOnTop
  - type: Sprite
    drawdepth: Walls
    sprite: KSR/ArmaturniKarkas.rsi
    layers:
    - state: electrified
      sprite: Effects/electricity.rsi
      map: ["enum.ElectrifiedLayers.Sparks"]
      shader: unshaded
      visible: false
    - state: full
  - type: Electrified
    requirePower: true
    noWindowInTile: true
    highVoltageNode: high
    mediumVoltageNode: medium
    lowVoltageNode: low
  - type: NodeContainer
    nodes:
      high:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      medium:
        !type:CableDeviceNode
        nodeGroupID: MVPower
      low:
        !type:CableDeviceNode
        nodeGroupID: Apc
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ElectrifiedVisuals.ShowSparks:
        enum.ElectrifiedLayers.Sparks:
          True: { visible: True }
          False: { visible: False }
  - type: AnimationPlayer
  - type: Damageable
    damageModifierSet: RodMetalMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal:
              min: 0
              max: 1
      - !type:PlaySoundBehavior
        sound:
          path: "/Audio/Weapons/grille_hit.ogg"
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: ArmaturniKarkas
    node: ArmaturniKarkas

- type: entity
  parent: [ BaseWindowStructure, StructureHealthBarrier ]
  id: Okno
  components:
  - type: Sprite
    sprite: KSR/Okno.rsi
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass: #Я БЛЯТЬ НЕ ЕБУ ПОЧЕМУ ПРИ РАЗРУШЕНИИ СПАВНИТСЯ НЕ 0-1 ОСКОЛКА, А СРАЗУ 1-2
              min: 0
              max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: Okno
    node: Okno